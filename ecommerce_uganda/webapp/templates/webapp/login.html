{% extends 'webapp/base.html' %}
{% load static %}

{% block title %}Log in| Clarastock{% endblock %}

{% block content %}
<section class="tight">
    <div class="container form-page blob-surface">
      <h1 style="font-size:1.8rem;">Welcome back</h1>
      <p class="muted" style="margin-bottom:32px;">Log in to continue</p>

      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required>
          <a href="{% url 'webapp:forgot_password' %}" class="muted" style="display:block;text-align:right;font-size:0.85rem;margin-top:6px;">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-gold" id="submit-btn" style="width:100%;">Log in</button>
      </form>

      <p style="margin-top:20px;text-align:center;" class="muted">
        Don't have an account? <a href="{% url 'webapp:signup' %}" id="signup-link">Sign up</a>
      </p>
    </div>
  </section>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', () => {
  if (isLoggedIn()) {
    window.location.href = isAgent() ? '{% url "webapp:agent_dashboard" %}' : '{% url "webapp:shop" %}';
    return;
  }

  // Carry the 'next' destination through to signup too, so someone who
  // lands here to check out but doesn't have an account yet still ends
  // up back at checkout after registering, not on the shop page.
  const next = getQueryParam('next');
  if (next) {
    document.getElementById('signup-link').href = '{% url "webapp:signup" %}?next=' + encodeURIComponent(next);
  }

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = 'Logging in...';
    try {
      const profile = await login(
        document.getElementById('email').value.trim(),
        document.getElementById('password').value
      );
      window.location.href = next ? decodeURIComponent(next) : (profile.role === 'agent' ? '{% url "webapp:agent_dashboard" %}' : '{% url "webapp:shop" %}');
    } catch (e) {
      showError(e);
      btn.disabled = false;
      btn.textContent = 'Log in';
    }
  });
});
</script>
{% endblock %}
