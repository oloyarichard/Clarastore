{% extends 'webapp/base.html' %}
{% load static %}

{% block title %}Checkout| Clarastock{% endblock %}

{% block content %}
<section class="tight">
    <div class="container">
      <h1 style="font-size:1.8rem;margin-bottom:24px;">Checkout</h1>

      <div id="loading" class="spinner-center"><span class="spinner"></span></div>

      <div id="checkout-content" class="checkout-layout" style="display:none;">
        <div class="checkout-main">
          <div class="card">
            <div class="field" style="margin-bottom:0;">
              <label for="district">Delivery district</label>
              <select id="district"></select>
            </div>
          </div>

          <div id="wallet-banner" class="checkout-banner" style="margin-top:20px;"></div>

          <button id="place-order-btn" class="btn btn-gold" style="width:100%;margin-top:20px;">Place order</button>
          <p style="text-align:center;margin-top:14px;">
            <a href="{% url 'webapp:wallet' %}">Top up wallet &rarr;</a>
          </p>
        </div>

        <div class="checkout-side">
          <div class="card">
            <h3 style="margin-top:0;">Order summary</h3>
            <div id="order-items"></div>
            <div class="summary-row total">
              <span>Total</span>
              <span id="order-total"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
{% endblock %}

{% block scripts %}
<script>
let cartTotal = 0;

document.addEventListener('DOMContentLoaded', async () => {
  requireAuth();
  renderAuthNav();

  try {
    const [cart, districts, wallet, profile] = await Promise.all([
      apiFetch('/cart/'),
      apiFetch('/auth/districts/', { auth: false }),
      apiFetch('/wallet/'),
      apiFetch('/auth/profile/'),
    ]);

    if (!cart.items.length) {
      window.location.href = '{% url "webapp:cart" %}';
      return;
    }

    cartTotal = cart.total;
    document.getElementById('order-items').innerHTML = cart.items.map(item => `
      <div class="summary-row">
        <span>${escapeHtml(item.product.name)} &times;${item.quantity}</span>
        <span>${formatUGX(item.subtotal)}</span>
      </div>
    `).join('');
    document.getElementById('order-total').textContent = formatUGX(cartTotal);

    const list = districts.results || districts;
    const select = document.getElementById('district');
    select.innerHTML = list.map(d =>
      `<option value="${d.id}" ${d.id === profile.district ? 'selected' : ''}>
        ${escapeHtml(d.name)}${d.type === 'hub' ? ' (Hub: direct delivery)' : ' (via hub, taxi/bus)'}
      </option>`
    ).join('');

    renderWalletBanner(wallet.balance);
    document.getElementById('loading').style.display = 'none';
    document.getElementById('checkout-content').style.display = 'grid';

    document.getElementById('place-order-btn').addEventListener('click', placeOrder);
  } catch (e) {
    document.getElementById('loading').style.display = 'none';
    showError(e);
  }
});

function renderWalletBanner(balance) {
  const banner = document.getElementById('wallet-banner');
  const insufficient = balance < cartTotal;
  banner.classList.toggle('insufficient', insufficient);
  banner.classList.toggle('sufficient', !insufficient);
  banner.textContent = insufficient
    ? `Wallet balance ${formatUGX(balance)} is not enough. Top up before checking out.`
    : `Paying from wallet: balance ${formatUGX(balance)}`;
  document.getElementById('place-order-btn').disabled = insufficient;
}

async function placeOrder() {
  const btn = document.getElementById('place-order-btn');
  const districtId = parseInt(document.getElementById('district').value, 10);
  btn.disabled = true;
  btn.textContent = 'Placing order...';

  try {
    const order = await apiFetch('/orders/checkout/', { method: 'POST', body: { district_id: districtId } });
    window.location.href = `/orders/${order.id}/`;
  } catch (e) {
    showError(e);
    btn.disabled = false;
    btn.textContent = 'Place order';
  }
}
</script>
{% endblock %}
