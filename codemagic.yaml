workflows:
  android-release:
    name: Clarastore Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      vars:
        # Replace with your machine's actual local IP (e.g. from `hostname -I`
        # on Linux, `ipconfig getifaddr en0` on Mac). Only works for testing
        # when your phone is on the same WiFi as this machine and your
        # Django server is running with `runserver 0.0.0.0:8000`.
        API_BASE_URL: "http://192.168.1.50:8000/api"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Set up platform folders, icons, and allow local HTTP testing
        script: |
          set -e

          # Creates android/ and ios/ if they don't exist yet in the repo.
          flutter create . --platforms=android,ios
          flutter pub get

          # Generates real launcher icons from assets/icon/icon.png +
          # icon_ios.png (already configured in pubspec.yaml).
          dart run flutter_launcher_icons

          # Android blocks plain HTTP by default since Android 9 — since
          # API_BASE_URL above is a local http:// address (not https://),
          # every request would otherwise fail with a "cleartext traffic
          # not permitted" error. This re-allows it for this build only.
          #
          # IMPORTANT: only appropriate for local testing. Remove this
          # step (or point API_BASE_URL at a real https:// domain) before
          # ever building a version meant for the Play Store.
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'usesCleartextTraffic' "$MANIFEST"; then
            sed -i.bak 's/<application/<application\n        android:usesCleartextTraffic="true"/' "$MANIFEST"
          fi
          cat "$MANIFEST"

      - name: Flutter analyze
        script: flutter analyze
        ignore_failure: true

      - name: Build Android APK (release)
        script: |
          flutter build apk --release --dart-define=API_BASE_URL=$API_BASE_URL

    artifacts:
      - build/app/outputs/flutter-apk/*.apk

    publishing:
      email:
        recipients:
          - oloyarichard2005@gmail.com
        notify:
          success: true
          failure: true
